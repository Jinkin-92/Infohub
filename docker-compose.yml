version: "3.9"

services:
  # RSSHub服务
  rsshub:
    image: diygod/rsshub:latest
    container_name: infohub-rsshub
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      PORT: 1200
    restart: unless-stopped
    networks:
      - infohub-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1200"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infohub-backend
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      SQLITE_PATH: ../data/infohub.db
      RSSHUB_URL: http://rsshub:1200
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      rsshub:
        condition: service_started
    networks:
      - infohub-network
    restart: unless-stopped

  # 前端Next.js服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infohub-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_TARGET: http://backend:3002
    depends_on:
      backend:
        condition: service_started
    networks:
      - infohub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  infohub-network:
    driver: bridge
